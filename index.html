<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A8B5C" />
    <meta name="description" content="식물의 성장을 사진으로 기록하는 다이어리. 사진을 올리면 촬영일시를 자동으로 가져옵니다." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 뜬다 (display: standalone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS 16.4 미만은 매니페스트의 display 를 읽지 않아 아래 태그가 필요하다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="그루" />
    <!-- default: 상태바가 본문을 덮지 않는다. 상단 safe-area 여백을 따로 두지 않았으므로 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- 워드마크 'Groo' 전용. 라틴 4글자라 본문 폰트와 섞지 않는다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>그루 - 식물 성장 일기</title>

    <!--
      링크 미리보기용. 카카오톡·페이스북 봇은 JS 를 실행하지 않으므로
      이 태그들은 반드시 정적 HTML 에 있어야 한다.
      TODO 배포 후: og:url 과 og:image 를 실제 도메인의 절대 URL 로 채운다.
                    og:image 는 1200×630 PNG 여야 한다 (SVG 는 카카오가 무시한다).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="그루" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="그루 - 식물 성장 일기" />
    <meta
      property="og:description"
      content="식물의 성장을 사진으로 기록하는 다이어리. 사진을 올리면 촬영일시를 자동으로 가져옵니다."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
